[project]
name = "lct-each-channel"
version = "0.1.0"
description = "Воспроизводимый эксперимент отдельных ежедневных моделей каналов"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost==1.2.10",
    "numpy==2.3.2",
    "pandas==2.3.2",
    "scikit-learn==1.7.1",
    "pyarrow==21.0.0",
    "duckdb==1.5.5",
    "py7zr==1.1.3",
    "matplotlib==3.10.7",
]

[dependency-groups]
dev = ["pytest==7.4.3", "ruff==0.16.9"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
