# Раздача сборки и прокси API. SPA: все неизвестные пути — index.html.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка журнала СМВУ — до 300 МБ, как у api (UPLOAD_MAX_BYTES); по умолчанию nginx режет тело на 1 МБ
        client_max_body_size 300m;
        # Живая лента (SSE): без буферизации и с долгим таймаутом
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
