[project]
name = "lct-ml-service"
version = "0.1.0"
description = "Расчёт признаков и скоринг моделей ML v3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "catboost>=1.2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 120
target-version = "py312"
# код ML-разработчика v3 — как есть (PR #114), стиль не правим
extend-exclude = ["../ml/v3", "../ml/notebooks/sensor_failure_v3_kaggle.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "tests"]
