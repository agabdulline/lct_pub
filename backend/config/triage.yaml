# Триаж дымовых тревог: эпизоды и вердикты (docs/architecture/backend.md §5, допущение A6).
# Значения подобраны по данным 2025 — 2026 H1 так, чтобы воспроизвести docs/research/data-findings.md §3:
# разрыв 25 мин даёт 1 625 эпизодов (в исследовании 1 606), правило плановой проверки с рычагом — 110
# (в исследовании 113); «рычаг или старт 9–12» дало бы 142.

alarm:
  sensor_type: Датчик дыма
  value: Обнаружен дым          # флаг «тревожное» не учитывается: в 2025 году у 70% таких событий он f

episodes:
  gap_minutes: 25               # тревоги объекта с разрывом не больше — один эпизод
  lever_value: Рычаг сдернут    # признак плановой проверки АПС
  lever_window_minutes: 30      # рычаг ищется в [начало − окно, конец + окно]

ppr:                            # плановая проверка: все условия сразу
  min_channels: 10
  weekdays: [1, 2, 3, 4, 5]     # ISO: понедельник — 1
  signature: lever              # lever — нужен рычаг; lever_or_hours — рычаг или старт в start_hours
  start_hours: [9, 12]          # [с, до) по Москве, только для lever_or_hours
equipment:                      # эпизоды оборудования в ленте (docs/architecture/backend.md §6.2)
  min_channels: 5               # столько не дымовых каналов объекта (уровень 2)…
  window_minutes: 5             # …ушли в тревожное состояние за это окно
  end_share: 0.5                # эпизод закрыт, когда в норму вернулась эта доля его каналов
  merge_minutes: 5              # объект снова набрал порог за столько после закрытия — дребезг, эпизод открыт снова
  states: [Обесточен, Неисправен, Отключено устройство]
  by_type:                      # тревожные значения отдельных типов, кроме общих
    Состояние насоса: [Затоплен]
    ИБП: [Питание от батарей, Батарея неисправна, Батарея разряжена]
  power_state: Обесточен        # больше половины каналов в нём — power_outage, иначе equipment_fault
  exclude_types: [Датчик дыма]  # дымовые — лента тревог
  sse_seconds: 2                # обновление эпизода в живую ленту — не чаще; закрытие — сразу

access:                         # вскрытие под охраной (docs/architecture/access.md §3, допущения A15, A17)
  guard_type: Состояние охраны  # канал охраны подобъекта
  door_types: [КД Дверь]
  hatch_types: [КД Люк, 9-секционный люк]
  gas_type: Газовый датчик      # волна переопроса считается без газа и канала охраны
  opened: Не замкнут
  closed: Норма
  armed: На охране
  disarmed: Снято с охраны
  faulty: Много неисправных устройств
  healthy: Устройства на объекте исправны
  motion: Обнаружено движение   # только с каналов motion_type: у дверей бывает то же значение (data-format.md §5)
  motion_type: Датчик движения
  disarm_grace_minutes: 5       # снятие охраны в [T, T + 5 мин] — «снято после открытия»
  long_armed_days: 7            # на охране дольше — «шумящий» контакт, не доступ
  episode_gap_minutes: 10       # тишина: столько без открытий при закрытых дверях и люках
  burst_channels: 5             # волна переопроса: столько каналов подобъекта…
  burst_seconds: 2              # …с событием в ±2 с от открытия
  motion_after_minutes: 5       # движение — от начала до последнего открытия + 5 мин
  night_hours: [22, 6]          # ночь по Москве: [с, до)
  weekend_days: [6, 7]          # ISO: суббота, воскресенье
  repeat_incidents: 3           # «повторяется» — столько инцидентов подобъекта…
  repeat_days: 7                # …со стартом в (start − 7 сут, start]
