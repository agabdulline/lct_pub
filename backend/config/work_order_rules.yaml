# Правила заявок v1 (docs/product/v1-scope.md «Правила заявок v1», D9). Регламентов ТО и ППР нет — значения наше
# допущение. Одна открытая заявка на канал и правило (индекс work_orders_open_uq). Время — системные часы:
# в прогоне симуляционное.
#
# Шаблоны названий: {channel} — название канала, {object} — название объекта канала (у внешних моделей канал —
# служебный канал цели «Узел 12 · оценка», объект — «Узел 12»), {sensor} — тип датчика строчными, {score} — оценка
# модели, {count} — число одиночных эпизодов, {hours} — часов в неисправности, {value} — значение события (билет
# машины у событийной модели) или объект цели.

alarm_model_alert:
  enabled: true
  description: Событийная модель оценила вероятность неисправности датчика за 24 ч выше порога
  models: [smoke_alarm]
  priority: high
  due_hours: 24
  title: "Проверить {sensor} {channel}: высокая вероятность неисправности в ближайшие 24 ч"

daily_model_alert:
  enabled: true
  description: Ежедневная модель оценила риск отказа канала в ближайшие 1–30 суток выше порога
  models: [daily]
  priority: low
  # средний приоритет — оценка в верхней половине диапазона от порога модели до 1 (v0: порог 0.639 → от 0.82),
  # иначе низкий; относительно порога, чтобы граница не устаревала со сменой версии модели
  priority_medium_above: 0.5
  # ежедневная модель даёт сотни тревог в сутки по сети; заявками становятся столько лучших по оценке за день,
  # остальные — в журнале прогнозов и на дашборде (топ-20 по риску)
  max_per_day: 20
  due_hours: 168
  title: "Проверить {sensor} {channel}: риск отказа в ближайшие 30 суток ({score:.2f})"

solitary_repeat:
  enabled: true
  description: Не меньше 3 одиночных тревог датчика за 30 суток — без модели, по эпизодам тревог
  min_episodes: 3               # одиночные эпизоды, а не тревоги: серия переключений за минуты — один эпизод
  window_days: 30
  priority: medium
  due_hours: 168
  title: "Проверить {sensor} {channel}: {count} одиночных тревог за 30 суток"

fault_persisting:
  enabled: true
  description: Канал в «Неисправен» дольше 72 ч — без модели, по текущему состоянию канала
  states: [Неисправен]
  min_hours: 72
  # разрыв данных перед прогоном дольше суток (журнал после конца базы) — длительность считается с начала журнала (A18)
  data_gap_hours: 24
  priority: high
  due_hours: 24
  title: "Устранить неисправность: {sensor} {channel} в «Неисправен» больше {hours} ч"

# Внешние наборы (этап 14, docs/architecture/external-data.md §6.3): те же заявки по прогнозам с тревогой, только на
# прогонах набора и по его моделям. Данные не Москоллектора — в названии заявки это видно по узлу и набору.

ext_fire_alert:
  enabled: true
  description: Внешняя модель Magdeburg — признаки пожара на мультисенсорном узле цеха (внешние данные)
  models: [magdeburg_fire]
  priority: high
  due_hours: 1
  title: "Проверить {object}: признаки пожара ({score:.2f})"

ext_access_violation:
  enabled: true
  description: Внешняя модель VAST — проезд без допуска или необычный маршрут (внешние синтетические данные)
  models: [vast_gate]
  priority: medium
  # одна открытая заявка на датчик: следующие тревоги на тех же воротах, пока заявка открыта, — в журнале прогнозов
  due_hours: 24
  title: "Разобрать проезд через {channel}: билет {value}"

ext_pdm_failure:
  enabled: true
  description: Внешняя модель Azure PdM — вероятен отказ компонента агрегата в ближайшие 24 ч (внешние синтетические данные)
  models: [pdm_failure_24h]
  priority: high
  due_hours: 24
  title: "Превентивная замена: {object} — риск отказа в ближайшие 24 ч ({score:.2f})"

access_open_armed:
  enabled: true
  description: Вскрытие под охраной — дверь или люк открыли на подобъекте под охраной, охрану не сняли за 5 мин (метка правил охраны, не подтверждённое проникновение)
  # приоритет — как у инцидента: высокий — люк, ночь или выходной, иначе средний (docs/architecture/access.md §3)
  priority: medium
  # канал заявки — канал охраны подобъекта: одна открытая заявка на подобъект; новый инцидент при открытой заявке
  # ссылается на неё
  due_hours: 1
  title: "Проверить вскрытие под охраной: {object}, {channels}"
