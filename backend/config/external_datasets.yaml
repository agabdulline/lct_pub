# Реестр внешних открытых наборов (docs/architecture/external-data.md §2).
# Номер k задаёт диапазоны id набора (§3.1): объекты 9 000 000 + k·10 000 + n, каналы 900 000 000 + k·1 000 000 + n.
# Файлы скачивает `python -m app.cli external download --dataset <ключ>` в data/external/<ключ>/raw/ и сверяет sha256.
# Наборы добавляются на своих этапах: VAST 2016 — 14.3.

datasets:
  magdeburg:
    k: 1
    title: Indoor Fire Dataset with Distributed Multi-Sensor Nodes (Industrial Hall)
    short: Magdeburg · цех
    direction: fire_risk
    description: >
      Опыты в промышленном цехе 10×22×8 м без вентиляции: 4 вида тления и горения (дерево, свечи, кабель, хлопок)
      и 8 видов помех (дым-машина, дезодорант, этанол, выброс CO, выхлоп, садовый мусор, сварка, абразивная резка),
      между опытами — фон. 9 мультисенсорных узлов, шаг 10 с, 10–13.07.2023.
    url: https://data.mendeley.com/datasets/yghykzm4km/1
    doi: 10.17632/yghykzm4km.1
    license: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    synthetic: false
    source_timezone: Europe/Berlin  # метки в данных с поясом +02:00; при подготовке — в московское время
    files:
      - name: industrial_hall.csv
        url: https://data.mendeley.com/public-files/datasets/yghykzm4km/files/ac22049a-6c73-4276-8583-05b2cf735601/file_downloaded
        size: 35800222
        sha256: b431b611a44e4282510bd53158aaa71512554481433d8f3a90f9475c17134839

  vast2017:
    k: 2
    title: VAST Challenge 2017, Mini-Challenge 1 — Lekagul Preserve
    short: VAST 2017 · заповедник
    direction: unauthorized_access
    description: >
      Синтетический журнал датчиков проезда заповедника Lekagul, 01.05.2015 — 31.05.2016: 40 датчиков (въезды,
      общие ворота, закрытые ворота, посты рейнджеров, кемпинги), машина получает на въезде билет с RF-меткой и класс.
      Закрытые ворота пропускают только машины рейнджеров (класс 2P) — правило из описания набора.
    url: https://www.cs.umd.edu/hcil/varepository/VAST%20Challenge%202017/challenges/Mini-Challenge%201/
    license: Бенчмарк VAST Challenge (IEEE VIS), лицензия не указана — для исследований и обучения
    synthetic: true
    source_timezone: без пояса, летнего времени в заповеднике нет — берётся как есть (A1)
    solution: https://www.cs.umd.edu/hcil/varepository/VAST%20Challenge%202017/challenges/Mini-Challenge%201/solution/VAST%20Challenge%202017%20MC1%20Solution%20Final.pdf
    files:
      - name: MC1Data.zip
        url: https://www.cs.umd.edu/hcil/varepository/VAST%20Challenge%202017/challenges/Mini-Challenge%201/dataset/MC1Data.zip
        size: 1335548
        sha256: 2a051c6713c9f0b0c48e1e985411902900aa5e8c3fb8ee05cb7b742bb9be3ed7

  # k = 3 — за VAST 2016 (14.3)
