[project]
name = "lct-backend"
version = "0.1.0"
description = "API, воркер, расписание и шлюз OPC UA сервиса диспетчеризации"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.4",
    "asyncua>=1.1",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
