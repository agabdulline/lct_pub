[project]
name = "lct-emulator"
version = "0.1.0"
description = "Эмулятор СМВУ: OPC UA сервер, сценарии из журнала, HTTP-управление"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncua>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "duckdb>=1.5.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
