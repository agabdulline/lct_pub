title: Неделя парка агрегатов
description: >
  Синтетический набор Microsoft Azure PdM: 100 агрегатов 4 моделей возрастом 0–20 лет, показания раз в час —
  напряжение, скорость вращения, давление, вибрация; коды ошибок, журнал ТО, отказы и ремонты. 23–29.11.2015,
  неделя — 67 350 событий: 77 кодов ошибок, 57 записей ТО, 16 отказов компонентов у 16 агрегатов. Показания
  приходят пачкой раз в час — до 429 в одну секунду.
dataset: azure_pdm
period:
  start: 2015-11-23T00:00:00
  end: 2015-11-30T00:00:00
objects: [9040001]
include_gas: false
speed: 600
# пачка до 429 показаний в секунду при выходе 200/с растягивается на ~2 с (D18); по p95 минуты вышло бы ×15,
# по среднему — 400 событий на час симуляции: на ×600 это 6 с и ~67 событий/с, события не теряются
max_speed: 600
