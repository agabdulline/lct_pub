title: Ночь объекта Дельта — охрану снимают после открытия двери
description: >
  Пятница 10 апреля 2026 года, подобъект «объект Дельта» комплекса «объект Дельта». Подобъект на охране с 9 апреля
  15:42. В 02:33:06 открывается «КД дверь отс. ПК50» с флагом тревоги, охрану снимают в 02:34:32 — через 86 с.
  С 02:45 до 03:15 открываются двери у ПК50 и ПК249 без флагов тревоги (с флагом — только КД АВ), в 03:19:01
  подобъект снова ставят на охрану. С 06:39:36 до 07:01:10 та же дверь ПК50 открывается 13 раз, каждый раз с флагом
  тревоги; охрану снимают в 07:01:37 — через 22 мин после первого утреннего открытия. Ещё в окне: тревоги насосов
  «ДУ объект Дельта» и «Температура ниже 3ºC» у ПК249+5 в 04:48.
