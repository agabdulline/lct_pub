title: Одиночная тревога шумящего датчика
description: >
  Ночь субботы 28 марта 2026 года на «объекте Тау». В 05:56 дымовой датчик «ДД ПК432 ур.4» (канал 93527)
  срабатывает и за три минуты пять раз переключается между «Обнаружен дым» и «Дыма нет»; другие дымовые датчики
  объекта в ±1 ч не срабатывают. В 08:01:55 датчик переходит в «Неисправен» — через 2 ч после первой тревоги.
  Единственный такой случай в 2026 году: одиночная тревога без неисправности за сутки до неё, затем «Неисправен»
  через 1–12 ч.
