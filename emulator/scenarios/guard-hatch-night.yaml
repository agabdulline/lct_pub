title: Люк открыт под охраной ночью
description: >
  Четверг 16 апреля 2026 года, подобъект «объект Дельта» комплекса «объект Дельта». Подобъект на охране с 16:58.
  В 22:17:10 открывается люк «КД люк 4-с ПК45» с флагом тревоги, затем ещё дважды — в 22:20:30 и 22:21:08 — и
  остаётся открытым. Охрану снимают в 22:33:59, через 17 мин после первого открытия. С 22:37 до 22:47 у ПК49–ПК50
  открываются двери и КД АВ, срабатывают датчики движения; у дверей флагов тревоги нет. Люк закрывают в 22:50:38,
  в 22:51:09 подобъект снова ставят на охрану.
